name: ifishy-dev

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ifishy_root
      MYSQL_DATABASE: ifishy
      MYSQL_USER: ifishy_dev
      MYSQL_PASSWORD: ifishy_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./CloudComputing
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "9080:8080"
    env_file:
      - ./CloudComputing/.env
    environment:
      PORT: 8080
      JWT_SECRET: dev-secret-ifishy
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ifishy
      DB_USER: ifishy_dev
      DB_PASS: ifishy_pass
      DATABASE_URL: mysql://ifishy_dev:ifishy_pass@db:3306/ifishy
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/usr/src/app/uploads
      - ./CloudComputing/src:/usr/src/app/src
      - ./CloudComputing/prisma:/usr/src/app/prisma
      - ./CloudComputing/scripts:/usr/src/app/scripts
      - ./CloudComputing/package.json:/usr/src/app/package.json
      - ./CloudComputing/package-lock.json:/usr/src/app/package-lock.json
      - ./CloudComputing/jest.config.js:/usr/src/app/jest.config.js
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  uploads:
