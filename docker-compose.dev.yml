name: ifishy-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifishy
      POSTGRES_USER: ifishy_dev
      POSTGRES_PASSWORD: ifishy_pass
    ports:
      - "5442:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifishy_dev -d ifishy"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./CloudComputing
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "9080:8080"
    env_file:
      - ./CloudComputing/.env
    environment:
      PORT: 8080
      JWT_SECRET: dev-secret-ifishy
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ifishy
      DB_USER: ifishy_dev
      DB_PASS: ifishy_pass
      DATABASE_URL: postgresql://ifishy_dev:ifishy_pass@db:5432/ifishy?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - ./CloudComputing/src:/usr/src/app/src
      - ./CloudComputing/prisma:/usr/src/app/prisma
      - ./CloudComputing/scripts:/usr/src/app/scripts
      - ./CloudComputing/package.json:/usr/src/app/package.json
      - ./CloudComputing/package-lock.json:/usr/src/app/package-lock.json
      - ./CloudComputing/jest.config.js:/usr/src/app/jest.config.js
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
