name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudComputing
    env:
      DATABASE_URL: postgresql://ifishy:ifishy@127.0.0.1:5432/ifishy?schema=public
      JWT_SECRET: ci-test-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ifishy
          POSTGRES_USER: ifishy
          POSTGRES_PASSWORD: ifishy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ifishy -d ifishy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CloudComputing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:cov

      - name: Apply migrations and seed
        run: npx prisma migrate deploy && npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - name: Build production image
        run: docker build -t ifishy-backend:${{ github.sha }} .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: CloudComputing
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
